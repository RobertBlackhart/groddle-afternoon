<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<!-- Served from the spike root by tools/loading-strips/build.mjs; game modules and assets resolve under public/. -->
<base href="/public/" />
<title>Loading strips</title>
<script src="vendor/pixi/pixi-8.23.0.min.js"></script>
</head>
<body style="margin:0;background:#222">
<script type="module">
/**
 * The game's modules as game.js names them, with their ?v= keys (tools/module-keys): a module
 * imported under another URL is a second copy, so the 2x/3x deco route installed on a bare
 * './js/textures.js' never reached the copy street-render.js draws with, and every deco without a
 * sharp copy asked for its old .png (404) and dropped out (#543: a machine room drew all black).
 */
const gameSrc = await (await fetch('game.js')).text();
const keyed = (name) => {
  const m = new RegExp(`from '(\\./js/${name.replace(/[.-]/g, '\\$&')}\\.js(?:\\?v=[0-9a-f]+)?)'`).exec(gameSrc);
  if (!m) throw new Error(`game.js does not import js/${name}.js`);
  return m[1];
};
const { installPixiFixes } = await import(keyed('pixi-fixes'));
const textureUrls = await import(keyed('textures'));
const { installHiresDecos } = await import(keyed('deco-hires'));
const { buildStreetEntities, buildStreetView, loadDecoManifest } = await import(keyed('street-render'));
const { streetWidth, streetHeight } = await import(keyed('street-model'));

const PIXI = globalThis.PIXI;
/**
 * The card shows the 840 x 160 strip in a 980 x 160 CSS box (object-fit: cover), so a 2x
 * screen wants about 2.33 px per strip px: the strip is written `scale` (?scale=, set by
 * build.mjs) times that size.
 */
const SCALE = Number(new URLSearchParams(location.search).get('scale')) || 2;
const OUT_W = Math.round(840 * SCALE);
const OUT_H = Math.round(160 * SCALE);
/** Drawn at this multiple of the strip, then box-filtered down (no mipmaps in Pixi). */
const OVER = SCALE >= 2 ? 2 : 4;

PIXI.Filter.defaultOptions.resolution = 'inherit';
installPixiFixes(PIXI);
// 2x deco WebPs (resolution 1 here, so never the 3x files).
installHiresDecos(textureUrls, { renderer: () => null });
const app = new PIXI.Application();
await app.init({ width: OUT_W * OVER, height: OUT_H * OVER, background: 0x8ec8e8, antialias: true, resolution: 1, preference: 'webgl', preserveDrawingBuffer: true });
const available = await loadDecoManifest();

function sprites(node, out = []) {
  if (node instanceof PIXI.Sprite) out.push(node);
  for (const c of node.children || []) sprites(c, out);
  return out;
}

async function settle(root, ms = 30000) {
  const until = Date.now() + ms;
  for (;;) {
    const pending = sprites(root).filter((s) => !s.destroyed && !textureUrls.isLoaded(s.texture) && !textureUrls.isFailed(s.texture));
    if (!pending.length || Date.now() > until) return pending.length;
    await new Promise((r) => setTimeout(r, 100));
  }
}

/**
 * The whole street at strip scale: the middleground at its world size, each
 * parallax layer scaled (uniformly) to the street's width and stood on the
 * street's bottom, the sky gradient behind; the strip is the bottom band.
 */
window.renderStrip = async (file) => {
  const street = await (await fetch(file)).json();
  const view = buildStreetView(street, PIXI, { renderer: app.renderer });
  const W = streetWidth(street);
  const H = streetHeight(street);
  for (const lc of view.parallaxLayers) {
    const { w, h } = lc.parallaxLayer;
    const k = W / w;
    lc.scale.set(k);
    lc.x = 0;
    lc.y = H - h * k;
  }
  // A wide street's strip reaches above its top: that band is the sky's top colour, not a stock blue.
  const top = /^[0-9a-f]{6}$/i.test(street.gradient?.top || '') ? parseInt(street.gradient.top, 16) : 0x8ec8e8;
  app.renderer.background.color = top;
  const sky = view.children.find((c) => c.zIndex === -1100);
  if (sky) { sky.x = 0; sky.y = 0; sky.width = W; sky.height = H; }
  // Layers above the middleground live in view.frontView since 71eea704 (they cover the avatars
  // in the game); the strip draws them over the view with its transform (G446: they had dropped out).
  const front = view.frontView || null;
  // R51 (#656): the street's things on the entity layer (its doors: the dinos, the subway
  // entrances), drawn as the game draws them, between the view and its front layers.
  const entities = buildStreetEntities(PIXI, street, available);
  const left = await settle(view) + await settle(entities) + (front ? await settle(front) : 0);
  // Blurred and recoloured layers bake once their textures arrive.
  await new Promise((r) => setTimeout(r, 400));
  const s = (OUT_W * OVER) / W;
  view.scale.set(s);
  view.x = 0;
  view.y = OUT_H * OVER - H * s;
  app.stage.addChild(view);
  entities.position.copyFrom(view.position);
  entities.scale.copyFrom(view.scale);
  app.stage.addChild(entities);
  if (front) {
    front.position.copyFrom(view.position);
    front.scale.copyFrom(view.scale);
    app.stage.addChild(front);
  }
  app.render();
  const big = app.canvas;
  // Halve with smoothing until the strip size (a cheap box filter).
  let src = big;
  let w = big.width;
  let h = big.height;
  while (w > OUT_W) {
    w = Math.max(OUT_W, Math.round(w / 2));
    h = Math.max(OUT_H, Math.round(h / 2));
    const c = document.createElement('canvas');
    c.width = w;
    c.height = h;
    const g = c.getContext('2d');
    g.imageSmoothingEnabled = true;
    g.imageSmoothingQuality = 'high';
    g.drawImage(src, 0, 0, w, h);
    src = c;
  }
  const url = src.toDataURL('image/jpeg', Number(new URLSearchParams(location.search).get('q')) || 0.7);
  // How much the picture varies (luma standard deviation over a 96 x 18 thumbnail): near 0 is
  // a flat sky with nothing on it, which build.mjs skips.
  const t = document.createElement('canvas');
  t.width = 96;
  t.height = 18;
  const tg = t.getContext('2d', { willReadFrequently: true });
  tg.drawImage(src, 0, 0, 96, 18);
  const px = tg.getImageData(0, 0, 96, 18).data;
  let sum = 0;
  let sq = 0;
  for (let i = 0; i < px.length; i += 4) {
    const y = 0.299 * px[i] + 0.587 * px[i + 1] + 0.114 * px[i + 2];
    sum += y;
    sq += y * y;
  }
  const n = px.length / 4;
  const spread = Math.sqrt(Math.max(0, sq / n - (sum / n) ** 2));
  const drawn = view.decoDrawn;
  if (front) app.stage.removeChild(front);
  app.stage.removeChild(entities);
  entities.destroy({ children: true });
  app.stage.removeChild(view);
  view.destroy({ children: true });
  return { url, W, H, missing: left, drawn, spread: Math.round(spread * 10) / 10 };
};
window.stripReady = true;
</script>
</body>
</html>
